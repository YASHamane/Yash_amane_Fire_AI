# rules_data/fy2024_25.yaml
#
# WHAT: Every law parameter for FY 2024-25 (AY 2025-26), salary income only.
# WHY:  Law lives in DATA, logic lives in code. When the law changes we edit
#       this file (see fy2025_26.yaml) instead of rewriting Python.
# HOW:  Each block carries `source` (an ID from sources.md) and `clause` (the
#       legal reference shown in the trace). A block without both is a bug.
#
# Money is in whole rupees. Rates are integer percentages (5 means 5%).
# Slabs: `upto` is the top of the band (inclusive); `upto: null` means "no limit".

fy: "2024-25"
assessment_year: "2025-26"

rounding:
  unit: 10                      # nearest Rs 10 (total income and tax payable)
  source: S9
  clause: "Sec 288A (total income), Sec 288B (amount payable)"

cess:
  rate_pct: 4                   # on tax plus surcharge, both regimes
  source: S1
  clause: "Health and Education Cess"

standard_deduction:
  old: 50000                    # lower of this and salary
  new: 75000
  source: S2
  clause: "Sec 16(ia); Sec 115BAC(1A)(ii) for the new regime"

# ---------------------------------------------------------------- OLD REGIME
old_regime:
  slabs:
    below_60:
      - {upto: 250000,  rate_pct: 0}
      - {upto: 500000,  rate_pct: 5}
      - {upto: 1000000, rate_pct: 20}
      - {upto: null,    rate_pct: 30}
    60_to_79:
      - {upto: 300000,  rate_pct: 0}
      - {upto: 500000,  rate_pct: 5}
      - {upto: 1000000, rate_pct: 20}
      - {upto: null,    rate_pct: 30}
    80_plus:
      - {upto: 500000,  rate_pct: 0}
      - {upto: 1000000, rate_pct: 20}
      - {upto: null,    rate_pct: 30}
    source: S1
    clause: "Finance Act 2024, First Schedule (normal rates), old regime"

  rebate_87a:
    income_limit: 500000        # rebate only if total income <= this
    max_rebate: 12500           # rebate = lesser of tax and this
    marginal_relief: false
    source: S7
    clause: "Sec 87A"

  surcharge:                    # applies to the whole tax when income exceeds `above`
    tiers:
      - {above: 5000000,   rate_pct: 10}
      - {above: 10000000,  rate_pct: 15}
      - {above: 20000000,  rate_pct: 25}
      - {above: 50000000,  rate_pct: 37}
    marginal_relief: true       # tax+surcharge <= tax at threshold + income above threshold
    source: S1
    clause: "Finance Act 2024, First Schedule, surcharge and marginal relief"

  # Deductions allowed in the old regime, with caps.
  deductions:
    section_80c:
      cap: 150000
      source: S1
      clause: "Sec 80C"
    section_80ccd_1b:
      cap: 50000
      source: S1
      clause: "Sec 80CCD(1B)"
    section_80d_self_family:
      cap: 25000
      cap_if_senior: 50000      # senior citizen = taxpayer age band 60+
      source: S1
      clause: "Sec 80D(2)"
    section_80d_parents:
      cap: 25000
      cap_if_senior: 50000      # parents aged 60+
      source: S1
      clause: "Sec 80D(2)"
    home_loan_interest_self_occupied:
      cap: 200000
      source: S1
      clause: "Sec 24(b) (self-occupied, loan on/after 1-4-1999, purchase/construction)"
    hra:
      metro_pct: 50             # of salary (basic + DA)
      non_metro_pct: 40
      rent_excess_over_salary_pct: 10   # rent paid minus 10% of salary
      metro_cities: [Delhi, Mumbai, Kolkata, Chennai]
      source: S8
      clause: "Sec 10(13A) read with Rule 2A"

# ---------------------------------------------------------------- NEW REGIME
new_regime:
  slabs:                        # same for every age band
    all_ages:
      - {upto: 300000,  rate_pct: 0}
      - {upto: 700000,  rate_pct: 5}
      - {upto: 1000000, rate_pct: 10}
      - {upto: 1200000, rate_pct: 15}
      - {upto: 1500000, rate_pct: 20}
      - {upto: null,    rate_pct: 30}
    source: S1
    clause: "Sec 115BAC(1A) as amended by Finance (No. 2) Act 2024"

  rebate_87a:
    income_limit: 700000
    max_rebate: 25000           # statute figure; S1 prints 20000, same result (see sources.md)
    marginal_relief: true       # above the limit: tax payable <= income minus limit
    source: S7
    clause: "Sec 87A, first proviso (a) and (b), for Sec 115BAC(1A)"

  surcharge:                    # new regime has no 37% tier
    tiers:
      - {above: 5000000,  rate_pct: 10}
      - {above: 10000000, rate_pct: 15}
      - {above: 20000000, rate_pct: 25}
    marginal_relief: true
    source: S1
    clause: "Finance Act 2024, First Schedule, surcharge and marginal relief"

  # Deductions allowed in the new regime (within this project's scope). Anything
  # not listed here is NOT allowed: 80C, 80CCD(1B), 80D, HRA, self-occupied 24(b).
  allowed_deductions: []
  disallowed_in_new_regime:
    - section_80c
    - section_80ccd_1b
    - section_80d_self_family
    - section_80d_parents
    - home_loan_interest_self_occupied
    - hra
  disallowed_source: S1
  disallowed_clause: "Sec 115BAC(2): only 80CCD(2), 80CCH and let-out 24(b) interest remain; none are in scope"
